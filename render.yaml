# Render blueprint: https://render.com/docs/blueprint-spec
# Deploy with: render blueprint launch   (or connect the repo in the dashboard)
services:
  - type: web
    name: app-store-review-analysis
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Set this in the Render dashboard to enable the LLM insight layer.
      # Without it the API still serves the full rule-based analysis.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_DATABASE_PATH
        value: /data/app_store_reviews.db
    disk:
      # SQLite needs a persistent mount; without it saved analyses are lost
      # on every deploy and restart.
      name: analysis-data
      mountPath: /data
      sizeGB: 1
