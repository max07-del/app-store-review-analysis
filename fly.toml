# Fly.io deployment. First run: fly launch --no-deploy --copy-config
# Then:  fly volumes create analysis_data --size 1
#        fly secrets set ANTHROPIC_API_KEY=sk-ant-...   # optional
#        fly deploy
app = "app-store-review-analysis"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_DATABASE_PATH = "/data/app_store_reviews.db"

[[mounts]]
  source = "analysis_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
