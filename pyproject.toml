[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-store-review-analysis"
version = "0.1.0"
description = "REST API for collecting and analyzing Apple App Store reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "vaderSentiment>=3.3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/services/report.py" = ["E501"]
"app/services/llm_insights.py" = ["E501"]
"app/services/text_analysis.py" = ["E501"]
